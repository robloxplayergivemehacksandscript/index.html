
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fake Easy Parkour</title>
<style>
body {
  margin:0;
  background:#101827;
  color:white;
  font-family:Arial;
  text-align:center;
}
h1 {color:#60a5fa}
canvas {
  background:linear-gradient(#7dd3fc,#dbeafe);
  border:4px solid white;
  max-width:95%;
  margin:auto;
  display:block;
}
button {
  padding:12px 20px;
  margin:8px;
  border:0;
  border-radius:8px;
  background:#2563eb;
  color:white;
  font-size:17px;
}
#message {font-size:20px;color:#facc15}
</style>
</head>
<body>

<h1>😂 FAKE EASY PARKOUR</h1>
<p>Looks easy... BUT IT ISN'T!</p>
<p>Move: A/D or Arrow Keys | Jump: SPACE</p>

<canvas id="game" width="850" height="420"></canvas>
<h2 id="message">Reach the finish!</h2>
<button onclick="restart()">Restart Game</button>

<script>
const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

let player, platforms, keys, camera, won, frame, messageTimer;

function restart(){
 player={x:35,y:320,w:25,h:35,vx:0,vy:0,ground:false};
 camera=0;
 won=false;
 frame=0;
 messageTimer=0;
 keys={};
 platforms=[
 {x:0,y:370,w:150,h:50},
 {x:190,y:370,w:100,h:50},
 {x:330,y:330,w:90,h:20},
 {x:470,y:370,w:100,h:50},
 {x:610,y:320,w:90,h:20},
 {x:760,y:370,w:100,h:50},
 {x:910,y:320,w:100,h:20},
 {x:1080,y:370,w:100,h:50},
 {x:1250,y:310,w:100,h:20},
 {x:1420,y:370,w:200,h:50}
 ];
 document.getElementById("message").textContent="Reach the finish!";
}
restart();

document.addEventListener("keydown",e=>{
 keys[e.key.toLowerCase()]=true;
 if([" ","ArrowUp","ArrowLeft","ArrowRight"].includes(e.key))e.preventDefault();
});
document.addEventListener("keyup",e=>keys[e.key.toLowerCase()]=false);

function troll(text){
 document.getElementById("message").textContent=text;
 messageTimer=100;
}

function update(){
 if(won)return;
 frame++;

 let oldY=player.y;
 let oldBottom=player.y+player.h;

 player.vx=0;
 if(keys["arrowright"]||keys["d"])player.vx=4;
 if(keys["arrowleft"]||keys["a"])player.vx=-4;

 if((keys[" "]||keys["arrowup"]||keys["w"])&&player.ground){
  player.vy=-11;
  player.ground=false;
 }

 player.x+=player.vx;
 player.vy+=0.55;
 player.y+=player.vy;
 player.ground=false;

 platforms.forEach((p,i)=>{
  if(player.x+player.w>p.x&&player.x<p.x+p.w&&
     oldBottom<=p.y+5&&player.y+player.h>=p.y&&player.vy>=0){
    player.y=p.y-player.h;
    player.vy=0;
    player.ground=true;

    if(i===1 && !p.used){
      p.used=true;
      troll("SURPRISE! That platform disappeared!");
      setTimeout(()=>p.y=600,150);
    }

    if(i===3&&!p.used){
      p.used=true;
      troll("THE FLOOR IS A TRAP!");
      setTimeout(()=>p.y=600,200);
    }

    if(i===6&&!p.used){
      p.used=true;
      troll("FAKE CHECKPOINT 😂");
      player.vy=-13;
    }
   }
 });

 // Hidden trick: a platform moves away as you approach.
 if(player.x>850 && !platforms[7].used){
   platforms[7].y=370;
   if(player.x>1020){
     platforms[7].used=true;
     platforms[7].y=600;
     troll("YOU THOUGHT THAT WAS SAFE?");
   }
 }

 // Fall off screen
 if(player.y>460){
  troll("LOL! TRY AGAIN!");
  restart();
 }

 // Fake finish line
 if(player.x>1510){
   if(!won){
    won=true;
    troll("WAIT... THAT WAS THE FAKE FINISH 😂");
    setTimeout(()=>{
     won=false;
     player.x=1520;
     troll("YOU GOT TROLLED! THE REAL FINISH IS AHEAD!");
    },1500);
   }
 }
 
 camera=Math.max(0,player.x-300);
 if(messageTimer>0)messageTimer--;
 else if(!won)document.getElementById("message").textContent="Keep going...";
}

function draw(){
 ctx.clearRect(0,0,850,420);

 ctx.fillStyle="#7dd3fc";
 ctx.fillRect(0,0,850,420);

 ctx.save();
 ctx.translate(-camera,0);

 // Platforms
 platforms.forEach((p,i)=>{
  if(p.y>500)return;
  ctx.fillStyle=i===6?"#facc15":"#16a34a";
  ctx.fillRect(p.x,p.y,p.w,p.h);
  ctx.fillStyle="#166534";
  ctx.fillRect(p.x,p.y,p.w,6);
 });

 // Fake finish sign
 ctx.fillStyle="#ef4444";
 ctx.fillRect(1530,245,8,125);
 ctx.fillStyle="white";
 ctx.fillRect(1538,245,110,45);
 ctx.fillStyle="black";
 ctx.font="18px Arial";
 ctx.fillText("FINISH?",1545,275);

 // Player
 ctx.fillStyle="#dc2626";
 ctx.fillRect(player.x,player.y,player.w,player.h);
 ctx.fillStyle="white";
 ctx.fillRect(player.x+15,player.y+7,5,5);

 ctx.restore();

 ctx.fillStyle="#111827";
 ctx.font="18px Arial";
 ctx.fillText("Distance: "+Math.floor(player.x),20,30);
}

function loop(){
 update();
 draw();
 requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
